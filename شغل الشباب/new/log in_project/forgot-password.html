<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap-5.3.8-dist/css/bootstrap.css" />
    <link rel="stylesheet" href="css/fontawesome/all.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Forgot Password</title>
  </head>
  <body>
    <div class="Forgot-wrapper">
        <div class="side-image">
      </div>
      <div class="side-form">
        <div class="form-content">
          <header>
            
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your details to reset your password</p>
          </header>
          <form id="resetForm">
            <!-- Email -->
            <div class="input-field">
              <label>Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <!-- Phone -->
            <div class="input-field">
              <label>Phone Number (Optional)</label>
              <input type="tel" id="phone" placeholder="01XXXXXXXXX" />
            </div>
            <!-- New Password -->
            <div class="input-field">
              <label>New Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="newPassword"
                  placeholder="••••••••"
                  required
                />
                <i class="fa-solid fa-eye eye-icon" id="toggleNewPassword"></i>
              </div>
            </div>
            <div class="input-field">
              <label>Confirm Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="••••••••"
                  required
                />
                <i
                  class="fa-solid fa-eye eye-icon"
                  id="toggleConfirmPassword"
                ></i>
              </div>
              <!-- Error Message -->
              <small class="error-text" id="passwordError"></small>
            </div>
            <button type="submit" class="btn-login">Update Password</button>
            <p class="footer-text">
              Remember your password?
              <a href="login.html">Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
    <!-- JS -->
    <script src="forgot-password.js"></script>
  </body>
</html>
