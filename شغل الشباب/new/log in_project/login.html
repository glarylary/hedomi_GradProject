<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap-5.3.8-dist/css/bootstrap.css" />
    <link rel="stylesheet" href="css/fontawesome/all.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Shopy Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="side-image">
      </div>
      <div class="side-form">
        <div class="form-content">
          <header>
            <h1>Welcome Back</h1>
            <p class="subtitle">Please enter your details to sign in.</p>
          </header>
          <form id="loginForm">
            <div class="input-field">
              <label>Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="input-field">
              <div class="password-wrapper">
                <input type="password" id="password" placeholder="••••••••" />
                <i class="fa-solid fa-eye eye-icon" id="togglePassword"></i>
              </div>
              <div class="label-row">
                <label>Password</label>
                <a href="forgot-password.html" class="forgot-link"
                  >Forgot Password?</a
                >
              </div>
            </div>
            <button type="submit" class="btn-login">Login</button>
            <!-- Sign Up Link -->
            <p class="footer-text">
              Don't have an account?
              <a href="sign in.html">Sign Up</a>
            </p>
          </form>
        </div>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
