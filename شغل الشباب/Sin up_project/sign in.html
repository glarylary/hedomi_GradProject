<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopy | Create Account</title>
    <link rel="stylesheet" href="css/bootstrap-5.3.8-dist/css/bootstrap.css" />
    <link rel="stylesheet" href="css/fontawesome/all.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container-fluid min-vh-100">
      <div class="row min-vh-100">
        <!-- ================= IMAGE SIDE (DESKTOP) ================= -->
        <div class="col-lg-6 d-none d-lg-block left-side position-relative">
          <div class="overlay">
            <h1>Define your style with<br />Shopy's curated collections.</h1>
          </div>
        </div>
        <!-- ================= FORM SIDE ================= -->
        <div class="col-lg-6 col-12 p-0">
          <!-- ========= MOBILE FULL BACKGROUND ========= -->
          <div
            class="d-lg-none mobile-bg d-flex justify-content-center align-items-center px-3"
          >
            <div class="mobile-form">
              <h4 class="text-center mb-3">
                <i class="fa-solid fa-bag-shopping text-success"></i> Hedomi
              </h4>
              <h5 class="text-center">Create Account</h5>
              <p class="text-center small">Join our fashion community</p>
              <form>
                <div class="mb-3 input-group">
                  <span class="input-group-text"
                    ><i class="fa fa-user"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="name"
                    required
                  />
                </div>
                <div class="mb-3 input-group">
                  <span class="input-group-text"
                    ><i class="fa fa-envelope"></i
                  ></span>
                  <input
                    type="email"
                    class="form-control"
                    placeholder="Email address"
                    required
                  />
                </div>
                <div class="mb-3 input-group">
                  <span class="input-group-text"
                    ><i class="fa fa-lock"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Password"
                    required
                  />
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" required />
                  <label class="form-check-label small">
                    I agree to the <span>Terms</span> & <span>Privacy</span>
                  </label>
                </div>
                <button class="btn btn-success w-100">
                  <i class="fa fa-user-plus"></i> Sign Up
                </button>
                <p class="text-center mt-3 small">
                  Already have an account? <a href="#">Login</a>
                </p>
              </form>
            </div>
          </div>
          <!-- ========= DESKTOP CENTERED FORM ========= -->
          <div
            class="d-none d-lg-flex min-vh-100 justify-content-center align-items-center"
          >
            <div class="form-box">
              <h2>Create Account</h2>
              <p>Join our community of fashion enthusiasts today.</p>
              <form>
                <div class="mb-3">
                  <label><i class="fa fa-user"></i> Name</label>
                  <input type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label><i class="fa fa-envelope"></i> Email</label>
                  <input type="email" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label><i class="fa fa-lock"></i> Password</label>
                  <input type="password" class="form-control" required />
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" required />
                  <label class="form-check-label">
                    I agree to the <span>Terms & Conditions</span> and
                    <span>Privacy Policy</span>
                  </label>
                </div>
                <button class="btn btn-success w-100">
                  <i class="fa fa-user-plus"></i> Sign Up
                </button>
                <p class="text-center mt-3">
                  Already have an account? <a href="#">Login</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
